    <filter id="shadow" x="8" y="12" width="48" height="48" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" flood-color="#2d241d" flood-opacity=".2" stdDeviation="3"/>
