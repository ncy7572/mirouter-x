<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Mirouter X router icon</title>
  <desc id="desc">A compact wireless router with two antennas and signal arcs.</desc>
  <defs>
