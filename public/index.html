<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mirouter X</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Mirouter X</p>
          <h1 id="routerName">Xiaomi Router</h1>
        </div>
        <div class="topbar-actions">
          <div class="database-size" id="databaseSize" title="SQLite data size" data-i18n-title="databaseSize">--</div>
          <button class="status-pill" id="collectorStatus" type="button" aria-label="Toggle live updates">
            <svg class="status-refresh-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"></path>
              <path d="M3 16v5h5"></path>
              <path d="M3 12A9 9 0 0 1 18.3 5.6L21 8"></path>
              <path d="M21 8V3h-5"></path>
            </svg>
            <span id="collectorStatusText">Connecting</span>
          </button>
          <label class="refresh-rate-control" title="Frontend refresh interval" data-i18n-title="frontendRefreshLabel">
            <span id="refreshRateText" data-i18n="frontendRefreshShort">Refresh</span>
            <input id="refreshRateSlider" type="range" min="1" max="60" step="1" value="10" aria-label="Frontend refresh interval">
            <output id="refreshRateValue" for="refreshRateSlider">10s</output>
          </label>
          <select class="theme-select" id="themeSelect" aria-label="Theme">
            <optgroup label="Light">
              <option value="light-warm">Light Warm</option>
              <option value="light-sage">Light Sage</option>
              <option value="light-paper">Light Paper</option>
            </optgroup>
            <optgroup label="Dark">
              <option value="dark-ember">Dark Ember</option>
              <option value="dark-forest">Dark Forest</option>
              <option value="dark-graphite">Dark Graphite</option>
            </optgroup>
          </select>
          <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language">中文</button>
          <button class="icon-button" id="refreshButton" title="Collect now" aria-label="Collect now">
            <span>↻</span>
          </button>
        </div>
      </header>

      <main>
        <section class="metrics-grid">
          <article class="metric">
            <span data-i18n="wanDown">WAN Down</span>
            <strong id="wanDown">--</strong>
          </article>
          <article class="metric">
            <span data-i18n="wanUp">WAN Up</span>
            <strong id="wanUp">--</strong>
          </article>
          <article class="metric">
            <span data-i18n="online">Online</span>
            <strong id="onlineCount">--</strong>
          </article>
          <article class="metric">
            <span>CPU</span>
            <strong id="cpuLoad">--</strong>
          </article>
          <article class="metric">
            <span data-i18n="memory">Memory</span>
            <strong id="memoryUsage">--</strong>
          </article>
          <article class="metric">
            <span data-i18n="uptime">Uptime</span>
            <strong id="uptime">--</strong>
          </article>
        </section>

        <section class="workspace">
          <aside class="side-panel">
            <div class="panel-head">
              <h2><span data-i18n="clients">Clients</span> <span id="clientTotal" class="client-count">0 Total</span></h2>
              <div class="client-head-actions">
                <button id="clientMetricToggle" class="metric-toggle" type="button" aria-pressed="true">Accumulated</button>
              </div>
            </div>
            <div class="client-search">
              <input id="clientSearch" type="search" placeholder="Filter clients" autocomplete="off" data-i18n-placeholder="filterClients">
            </div>
            <div class="client-list" id="clientList"></div>
          </aside>

          <section class="chart-panel">
            <div class="chart-head">
              <div>
                <h2 id="chartTitle">WAN Traffic</h2>
                <p id="chartSubtitle">Downstream and upstream throughput</p>
              </div>
              <div class="range-tools">
                <button class="zoom-out-button" id="zoomOutButton" type="button" hidden data-i18n="zoomOut">Reset</button>
                <div class="scale-toggle" id="chartScaleControl" role="group" aria-label="Chart Y scale">
                  <button data-scale="log" type="button" class="active" data-i18n="scaleLog">Log</button>
                  <button data-scale="linear" type="button" data-i18n="scaleLinear">Linear</button>
                </div>
                <div class="segmented" id="rangeControl">
                  <button data-range="15m" class="active">15m</button>
                  <button data-range="1h">1h</button>
                  <button data-range="1d">1d</button>
                  <button data-range="7d">7d</button>
                  <button data-range="30d">30d</button>
                  <button data-range="custom" data-i18n="timeRange">Time range</button>
                </div>
                <div class="custom-range" id="customRange" hidden>
                  <input id="customFrom" type="datetime-local" aria-label="Start time" data-i18n-aria-label="startTime">
                  <input id="customTo" type="datetime-local" aria-label="End time" data-i18n-aria-label="endTime">
                  <button id="applyCustomRange" type="button" data-i18n="apply">Apply</button>
                </div>
              </div>
            </div>
            <div class="chart-wrap">
              <canvas id="trafficChart" tabindex="0" aria-label="Traffic chart"></canvas>
              <div class="empty-chart" id="emptyChart" data-i18n="waitingSamples">Waiting for traffic samples</div>
              <div class="chart-tooltip" id="chartTooltip" role="status" aria-live="polite"></div>
            </div>
            <div class="legend">
              <span><i class="down"></i><span data-i18n="down">Down</span></span>
              <span><i class="up"></i><span data-i18n="up">Up</span></span>
              <span id="bucketInfo"></span>
            </div>
            <div class="usage-grid">
              <article class="usage-card">
                <div class="usage-head">
                  <h2 data-i18n="accumulatedDown">Accumulated Down</h2>
                  <span id="usageDownTotal">--</span>
                </div>
                <div class="pie-row">
                  <canvas id="usageDownChart" width="180" height="180" aria-label="Download usage pie chart"></canvas>
                  <div class="pie-legend" id="usageDownLegend"></div>
                </div>
              </article>
              <article class="usage-card">
                <div class="usage-head">
                  <h2 data-i18n="accumulatedUp">Accumulated Up</h2>
                  <span id="usageUpTotal">--</span>
                </div>
                <div class="pie-row">
                  <canvas id="usageUpChart" width="180" height="180" aria-label="Upload usage pie chart"></canvas>
                  <div class="pie-legend" id="usageUpLegend"></div>
                </div>
              </article>
            </div>
          </section>
        </section>

        <section class="details-grid">
          <article class="detail-panel">
            <div class="panel-head">
              <h2 data-i18n="mesh">Mesh</h2>
              <span id="meshStatus">--</span>
            </div>
            <div id="meshList" class="mesh-list"></div>
          </article>
          <article class="detail-panel">
            <div class="panel-head">
              <h2 data-i18n="wifi">Wi-Fi</h2>
              <span id="wifiStatus">--</span>
            </div>
            <div id="wifiList" class="wifi-list"></div>
          </article>
        </section>
      </main>
    </div>

    <div class="pie-tooltip" id="pieTooltip"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
